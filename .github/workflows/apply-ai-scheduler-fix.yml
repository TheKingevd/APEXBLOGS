name: apply-ai-scheduler-fix

on:
  push:
    branches:
      - fix/ai-blog-scheduler-2026-09-09

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: |
          git apply --check fixes/ai-scheduler.patch
          git apply fixes/ai-scheduler.patch

      - name: Validate JavaScript
        run: node --check server.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f fixes/ai-scheduler.patch .github/workflows/apply-ai-scheduler-fix.yml
          git add server.js
          git add -u
          git commit -m "fix: repair AI article generation and scheduler deduplication"
          git push origin HEAD:fix/ai-blog-scheduler-2026-09-09
