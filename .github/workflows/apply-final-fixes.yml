name: apply-final-apexblogs-fixes

on:
  push:
    branches:
      - fix/apexblogs-3-bugs-2026-09-10

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch server.js
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text(encoding='utf-8')

          old = """    let corFoco = corFocoAceitavel(varFoco) ? varFoco : null;
    if (!corFoco && corFocoAceitavel(ctaBtnHex)) corFoco = ctaBtnHex;
    if (!corFoco && corFocoAceitavel(primaryBtnHex)) corFoco = primaryBtnHex;
    if (!corFoco && varFoco) corFoco = varFoco; // queda: usa a var mesmo assim
"""
          new = """    let corFoco = null;
    // CTA visível tem prioridade sobre variáveis genéricas de destaque.
    if (corFocoAceitavel(ctaBtnHex)) corFoco = ctaBtnHex;
    if (!corFoco && corFocoAceitavel(primaryBtnHex)) corFoco = primaryBtnHex;
    if (!corFoco && corFocoAceitavel(varFoco)) corFoco = varFoco;
    if (!corFoco && varFoco) corFoco = varFoco;
"""
          if old not in s: raise SystemExit('branding block not found')
          s = s.replace(old, new, 1)

          marker = """/**
 * Gera e publica um post automaticamente para um cliente.
 */
async function gerarPostAutomatico(clientId) {
"""
          helper = r'''function normalizarKeywordPrincipal(termo, localizacao) {
  let texto = String(termo || '').replace(/\s+/g, ' ').trim();
  const local = String(localizacao || '').replace(/\s+/g, ' ').trim();
  texto = texto
    .replace(/\bEMERGENCIAL(?=\d)/gi, 'EMERGENCIAL ')
    .replace(/\bURGENTE(?=\d)/gi, 'URGENTE ')
    .replace(/\b24HORAS\b/gi, '24 HORAS')
    .replace(/\b24H\b/gi, '24 HORAS')
    .replace(/\s+/g, ' ').trim();
  if (local && texto.toLowerCase().endsWith(` em ${local}`.toLowerCase())) {
    texto = texto.slice(0, -(local.length + 4)).trim();
  }
  return texto || 'serviço especializado';
}

function limparConteudoIA(conteudo, titulo) {
  let texto = String(conteudo || '')
    .replace(/\r\n/g, '\n')
    .replace(/<!DOCTYPE[^>]*>/gi, '')
    .replace(/<html[^>]*>/gi, '')
    .replace(/<\/html>/gi, '')
    .replace(/<head[^>]*>[\s\S]*?<\/head>/gi, '')
    .replace(/<body[^>]*>/gi, '')
    .replace(/<\/body>/gi, '')
    .replace(/<\/r>/gi, '</strong>')
    .replace(/^```(?:html)?\s*/i, '')
    .replace(/\s*```$/i, '').trim();
  const linhas = texto.split('\n');
  const primeira = (linhas[0] || '').replace(/<[^>]+>/g, '').replace(/^[*#\-•\s]+/, '').trim();
  if (titulo && primeira && primeira.toLowerCase() === String(titulo).trim().toLowerCase()) {
    linhas.shift();
    texto = linhas.join('\n').trim();
  }
  if (!/<(?:h2|h3|p|ul|ol|li)\b/i.test(texto)) texto = humanizarTexto(texto);
  texto = texto.replace(/^\s*<h1[^>]*>[\s\S]*?<\/h1>\s*/i, '');
  return texto.trim();
}

/**
 * Gera e publica um post automaticamente para um cliente.
 */
async function gerarPostAutomatico(clientId) {
'''
          if marker not in s: raise SystemExit('AI marker not found')
          s = s.replace(marker, helper, 1)
          s = s.replace("const termoBase = kw ? kw.termo : termo;", "const termoBase = normalizarKeywordPrincipal(kw ? kw.termo : termo, client.localizacao);", 1)
          s = s.replace('"urgence", "24 horas"', '"urgente", "24 horas"', 1)
          s = s.replace('em <strong>negrito</r', 'em <strong>negrito</strong>.', 1)

          old_cleanup = r'''            conteudo = conteudo
              .replace(/<!DOCTYPE[^>]*>/gi, '')
              .replace(/<html[^>]*>/gi, '')
              .replace(/<\/html>/gi, '')
              .replace(/<head[^>]*>[\s\S]*?<\/head>/gi, '')
              .replace(/<body[^>]*>/gi, '')
              .replace(/<\/body>/gi, '')
              .replace(/^[*\-•#\s]*t[íi]tulo:[^\r\n]+\r?\n?/i, '')
              .replace(/<h1[^>]*>[\s\S]*?<\/h1>/gi, '')
              .replace(/^[*\-•#\s]*varia[çc][õo]es:[^\r\n]+\r?\n?/i, '')
              // Remove code fences de markdown ```html ... ``` que a IA às vezes embrulha
              .replace(/^```[a-zA-Z0-9]*\s*\r?\n?/i, '')
              .replace(/\r?\n?```\s*$/i, '')
              .trim();
'''
          if old_cleanup not in s: raise SystemExit('AI cleanup block not found')
          s = s.replace(old_cleanup, "            conteudo = limparConteudoIA(conteudo, titulo);\n", 1)

          old_schema = """    ultimo_post DATETIME,
    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
"""
          new_schema = """    ultimo_post DATETIME,
    ultimo_slot TEXT,
    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,
"""
          if old_schema not in s: raise SystemExit('schedule schema block not found')
          s = s.replace(old_schema, new_schema, 1)

          anchor = """  db.run(`CREATE TABLE IF NOT EXISTS client_ads ("""
          if anchor not in s: raise SystemExit('migration anchor not found')
          s = s.replace(anchor, "  db.run(\"ALTER TABLE post_schedules ADD COLUMN ultimo_slot TEXT\", () => {});\n\n" + anchor, 1)

          old_window = """        // Verifica se o horário atual bate com o agendamento OU se estava previsto nos últimos 3 minutos
        const matchesNow = horarios.includes(hhmm);
        let matchesRecent = false;
        if (!matchesNow) {
          for (const h of horarios) {
            const [hHour, hMin] = h.split(':').map(Number);
            const diffMin = (hour * 60 + minute) - (hHour * 60 + hMin);
            if (diffMin > 0 && diffMin <= 3) {
              matchesRecent = true;
              break;
            }
          }
        }

        if (!matchesNow && !matchesRecent) continue;

        // Evita disparar duas vezes para o mesmo agendamento nos últimos 3 minutos
        if (sched.ultimo_post) {
          const ultimo = new Date(sched.ultimo_post.endsWith('Z') ? sched.ultimo_post : sched.ultimo_post + 'Z');
          const diffMin = (now.getTime() - ultimo.getTime()) / 60000;
          if (diffMin < 3) continue;
        }

        console.log(`[CRON] 🚀 Disparando agendamento (Schedule ID: ${sched.id}, Client ID: ${sched.client_id}) às ${hhmm}`);
        db.run('UPDATE post_schedules SET ultimo_post = CURRENT_TIMESTAMP WHERE id = ?', [sched.id]);

        if (sched.client_id === 0 || sched.client_id === 'ALL' || sched.client_id === 'TODOS') {
"""
          new_window = """        // Aceita no máximo 1 minuto de atraso. O slot persistido impede repetição após F5/restart.
        const matchesNow = horarios.includes(hhmm);
        let slotHora = matchesNow ? hhmm : null;
        if (!slotHora) {
          for (const h of horarios) {
            const [hHour, hMin] = h.split(':').map(Number);
            const diffMin = (hour * 60 + minute) - (hHour * 60 + hMin);
            if (diffMin > 0 && diffMin <= 1) { slotHora = h; break; }
          }
        }
        if (!slotHora) continue;
        const slotKey = `${isoDate} ${slotHora}`;
        if (sched.ultimo_slot === slotKey) continue;
        console.log(`[CRON] 🚀 Disparando agendamento (Schedule ID: ${sched.id}, Client ID: ${sched.client_id}) às ${hhmm} | Slot: ${slotKey}`);
        db.run(
          'UPDATE post_schedules SET ultimo_post = CURRENT_TIMESTAMP, ultimo_slot = ? WHERE id = ? AND (ultimo_slot IS NULL OR ultimo_slot != ?)',
          [slotKey, sched.id, slotKey],
          function(updateErr) {
            if (updateErr || this.changes !== 1) return;
            if (sched.client_id === 0 || sched.client_id === 'ALL' || sched.client_id === 'TODOS') {
"""
          if old_window not in s: raise SystemExit('scheduler block not found')
          s = s.replace(old_window, new_window, 1)

          old_close = """          gerarPostAutomatico(sched.client_id)
            .then(r => console.log(`[CRON] ✅ Post publicado: \"${r.titulo}\" para ${r.client_name}`))
            .catch(e => console.error(`[CRON] ❌ Falha:`, e.message));
        }

      } catch(e) {
"""
          new_close = """              gerarPostAutomatico(sched.client_id)
                .then(r => console.log(`[CRON] ✅ Post publicado: \"${r.titulo}\" para ${r.client_name}`))
                .catch(e => console.error(`[CRON] ❌ Falha:`, e.message));
            }
          }
        );

      } catch(e) {
"""
          if old_close not in s: raise SystemExit('scheduler close block not found')
          s = s.replace(old_close, new_close, 1)

          p.write_text(s, encoding='utf-8')
          print('server.js patched')

      - name: Validate JavaScript
        run: node --check server.js

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-apexblogs-3-bugs.yml .github/workflows/apply-final-fixes.yml
          git add server.js
          git add -u
          git commit -m "fix: repair client branding AI content and scheduler deduplication"
          git push origin HEAD:fix/apexblogs-3-bugs-2026-09-10
