name: apply-pr-fixes

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Apply fixes to PR branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            const headRepo = context.payload.pull_request.head.repo.full_name;
            if (headRepo !== `${owner}/${repo}`) core.setFailed('PR head must be this repository');

            const get = await github.rest.repos.getContent({ owner, repo, path: 'server.js', ref: branch });
            const sha = get.data.sha;
            let s = Buffer.from(get.data.content, 'base64').toString('utf8');

            const brandingOld = `    let corFoco = corFocoAceitavel(varFoco) ? varFoco : null;\n    if (!corFoco && corFocoAceitavel(ctaBtnHex)) corFoco = ctaBtnHex;\n    if (!corFoco && corFocoAceitavel(primaryBtnHex)) corFoco = primaryBtnHex;\n    if (!corFoco && varFoco) corFoco = varFoco; // queda: usa a var mesmo assim\n`;
            const brandingNew = `    let corFoco = null;\n    // CTA visível tem prioridade sobre variáveis genéricas de destaque.\n    if (corFocoAceitavel(ctaBtnHex)) corFoco = ctaBtnHex;\n    if (!corFoco && corFocoAceitavel(primaryBtnHex)) corFoco = primaryBtnHex;\n    if (!corFoco && corFocoAceitavel(varFoco)) corFoco = varFoco;\n    if (!corFoco && varFoco) corFoco = varFoco;\n`;
            if (!s.includes(brandingOld) && !s.includes(brandingNew)) core.setFailed('branding block not found');
            if (s.includes(brandingOld)) s = s.replace(brandingOld, brandingNew);

            const marker = `/**\n * Gera e publica um post automaticamente para um cliente.\n */\nasync function gerarPostAutomatico(clientId) {\n`;
            const helper = `function normalizarKeywordPrincipal(termo, localizacao) {\n  let texto = String(termo || '').replace(/\\s+/g, ' ').trim();\n  const local = String(localizacao || '').replace(/\\s+/g, ' ').trim();\n  texto = texto.replace(/\\bEMERGENCIAL(?=\\d)/gi, 'EMERGENCIAL ').replace(/\\bURGENTE(?=\\d)/gi, 'URGENTE ').replace(/\\b24HORAS\\b/gi, '24 HORAS').replace(/\\b24H\\b/gi, '24 HORAS').replace(/\\s+/g, ' ').trim();\n  if (local && texto.toLowerCase().endsWith(\` em \\${local}\`.toLowerCase())) texto = texto.slice(0, -(local.length + 4)).trim();\n  return texto || 'serviço especializado';\n}\n\nfunction limparConteudoIA(conteudo, titulo) {\n  let texto = String(conteudo || '').replace(/\\r\\n/g, '\\n').replace(/<!DOCTYPE[^>]*>/gi, '').replace(/<html[^>]*>/gi, '').replace(/<\\/html>/gi, '').replace(/<head[^>]*>[\\s\\S]*?<\\/head>/gi, '').replace(/<body[^>]*>/gi, '').replace(/<\\/body>/gi, '').replace(/<\\/r>/gi, '</strong>').replace(/^\\`\\`\\`(?:html)?\\s*/i, '').replace(/\\s*\\`\\`\\`$/i, '').trim();\n  const linhas = texto.split('\\n');\n  const primeira = (linhas[0] || '').replace(/<[^>]+>/g, '').replace(/^[*#\\-•\\s]+/, '').trim();\n  if (titulo && primeira && primeira.toLowerCase() === String(titulo).trim().toLowerCase()) { linhas.shift(); texto = linhas.join('\\n').trim(); }\n  if (!/<(?:h2|h3|p|ul|ol|li)\\b/i.test(texto)) texto = humanizarTexto(texto);\n  texto = texto.replace(/^\\s*<h1[^>]*>[\\s\\S]*?<\\/h1>\\s*/i, '');\n  return texto.trim();\n}\n\n`;
            if (!s.includes('function normalizarKeywordPrincipal(')) {
              if (!s.includes(marker)) core.setFailed('AI marker not found');
              s = s.replace(marker, helper + marker);
            }

            s = s.replace('const termoBase = kw ? kw.termo : termo;', 'const termoBase = normalizarKeywordPrincipal(kw ? kw.termo : termo, client.localizacao);');
            s = s.replace('"urgence", "24 horas"', '"urgente", "24 horas"');
            s = s.replace('em <strong>negrito</r', 'em <strong>negrito</strong>.');

            const cleanupOld = /            conteudo = conteudo\n              \.replace\(\/<!DOCTYPE\[\^>\]\*\/gi, ''\)[\s\S]*?\.trim\(\);/;
            if (cleanupOld.test(s)) s = s.replace(cleanupOld, '            conteudo = limparConteudoIA(conteudo, titulo);');

            const schemaOld = '    ultimo_post DATETIME,\n    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,\n';
            if (s.includes(schemaOld) && !s.includes('ultimo_slot TEXT')) s = s.replace(schemaOld, '    ultimo_post DATETIME,\n    ultimo_slot TEXT,\n    created_at DATETIME DEFAULT CURRENT_TIMESTAMP,\n');
            const migrationAnchor = '  db.run(`CREATE TABLE IF NOT EXISTS client_ads (';
            if (s.includes(migrationAnchor) && !s.includes('ALTER TABLE post_schedules ADD COLUMN ultimo_slot')) s = s.replace(migrationAnchor, '  db.run("ALTER TABLE post_schedules ADD COLUMN ultimo_slot TEXT", () => {});\n\n' + migrationAnchor);

            const schedulerOld = `        // Verifica se o horário atual bate com o agendamento OU se estava previsto nos últimos 3 minutos\n        const matchesNow = horarios.includes(hhmm);\n        let matchesRecent = false;\n        if (!matchesNow) {\n          for (const h of horarios) {\n            const [hHour, hMin] = h.split(':').map(Number);\n            const diffMin = (hour * 60 + minute) - (hHour * 60 + hMin);\n            if (diffMin > 0 && diffMin <= 3) {\n              matchesRecent = true;\n              break;\n            }\n          }\n        }\n\n        if (!matchesNow && !matchesRecent) continue;\n\n        // Evita disparar duas vezes para o mesmo agendamento nos últimos 3 minutos\n        if (sched.ultimo_post) {\n          const ultimo = new Date(sched.ultimo_post.endsWith('Z') ? sched.ultimo_post : sched.ultimo_post + 'Z');\n          const diffMin = (now.getTime() - ultimo.getTime()) / 60000;\n          if (diffMin < 3) continue;\n        }\n\n        console.log(`[CRON] 🚀 Disparando agendamento (Schedule ID: \${sched.id}, Client ID: \${sched.client_id}) às \${hhmm}`);\n        db.run('UPDATE post_schedules SET ultimo_post = CURRENT_TIMESTAMP WHERE id = ?', [sched.id]);\n\n        if (sched.client_id === 0 || sched.client_id === 'ALL' || sched.client_id === 'TODOS') {\n`;
            const schedulerNew = `        // Aceita no máximo 1 minuto de atraso. O slot persistido impede repetição após F5/restart.\n        const matchesNow = horarios.includes(hhmm);\n        let slotHora = matchesNow ? hhmm : null;\n        if (!slotHora) {\n          for (const h of horarios) {\n            const [hHour, hMin] = h.split(':').map(Number);\n            const diffMin = (hour * 60 + minute) - (hHour * 60 + hMin);\n            if (diffMin > 0 && diffMin <= 1) { slotHora = h; break; }\n          }\n        }\n        if (!slotHora) continue;\n        const slotKey = \`${isoDate} \${slotHora}\`;
        if (sched.ultimo_slot === slotKey) continue;\n        console.log(\`[CRON] 🚀 Disparando agendamento (Schedule ID: \${sched.id}, Client ID: \${sched.client_id}) às \${hhmm} | Slot: \${slotKey}\`);\n        db.run('UPDATE post_schedules SET ultimo_post = CURRENT_TIMESTAMP, ultimo_slot = ? WHERE id = ? AND (ultimo_slot IS NULL OR ultimo_slot != ?)', [slotKey, sched.id, slotKey], function(updateErr) {\n          if (updateErr || this.changes !== 1) return;\n          if (sched.client_id === 0 || sched.client_id === 'ALL' || sched.client_id === 'TODOS') {\n`;
            if (s.includes(schedulerOld)) s = s.replace(schedulerOld, schedulerNew);

            const closeOld = `          gerarPostAutomatico(sched.client_id)\n            .then(r => console.log(\`[CRON] ✅ Post publicado: \"\${r.titulo}\" para \${r.client_name}\`))\n            .catch(e => console.error(\`[CRON] ❌ Falha:\`, e.message));\n        }\n\n      } catch(e) {\n`;
            const closeNew = `              gerarPostAutomatico(sched.client_id)\n                .then(r => console.log(\`[CRON] ✅ Post publicado: \"\${r.titulo}\" para \${r.client_name}\`))\n                .catch(e => console.error(\`[CRON] ❌ Falha:\`, e.message));\n            }\n          }\n        );\n\n      } catch(e) {\n`;
            if (s.includes(closeOld)) s = s.replace(closeOld, closeNew);

            const result = await github.rest.repos.createOrUpdateFileContents({
              owner, repo, path: 'server.js', message: 'fix: repair client branding AI content and scheduler deduplication', content: Buffer.from(s, 'utf8').toString('base64'), sha, branch
            });
            core.info(`server.js updated: ${result.data.commit.sha}`);

            await github.rest.repos.deleteFile({ owner, repo, path: '.github/workflows/fix-apexblogs-3-bugs.yml', message: 'chore: remove temporary fix workflow', sha: (await github.rest.repos.getContent({ owner, repo, path: '.github/workflows/fix-apexblogs-3-bugs.yml', ref: branch })).data.sha, branch }).catch(() => {});
            await github.rest.repos.deleteFile({ owner, repo, path: '.github/workflows/apply-final-fixes.yml', message: 'chore: remove temporary fix workflow', sha: (await github.rest.repos.getContent({ owner, repo, path: '.github/workflows/apply-final-fixes.yml', ref: branch })).data.sha, branch }).catch(() => {});
            await github.rest.repos.deleteFile({ owner, repo, path: '.github/workflows/apply-pr-fixes.yml', message: 'chore: remove temporary fix workflow', sha: (await github.rest.repos.getContent({ owner, repo, path: '.github/workflows/apply-pr-fixes.yml', ref: branch })).data.sha, branch }).catch(() => {});
