<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog CRM — Entrar</title>
<meta name="description" content="Acesse o painel de controle do Blog CRM para gerenciar seus blogs automatizados com IA.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ── Tokens ───────────────────────────────────────────────────────────────────── */
:root {
  --bg:          #000000;
  --bg2:         #111114;
  --surface:     rgba(13, 13, 16, 0.78);
  --surface2:    #202026;
  --border:      rgba(255, 255, 255, 0.12);
  --border2:     rgba(255, 255, 255, 0.14);

  --primary:     #2563eb;   /* Electric Cobalt Blue */
  --primary-d:   #1d4ed8;
  --primary-s:   rgba(37, 99, 235, 0.12);
  --primary-glow:rgba(37, 99, 235, 0.28);

  --emerald:     #10b981;
  --rose:        #f43f5e;

  --text:        #f8fafc;
  --text2:       #a1a1aa;
  --text3:       #71717a;

  --radius:      12px;
  --radius-lg:   18px;
  --font-sans:   "Inter", ui-sans-serif, system-ui, sans-serif;
  --font-heading:"Plus Jakarta Sans", "Inter", sans-serif;
  --ease-out:    cubic-bezier(.16,1,.3,1);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0 }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ── Background mesh ─────────────────────────────────────────────────────────── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, oklch(0.72 0.15 192 / 8%) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 90%, oklch(0.7 0.16 155 / 6%) 0%, transparent 55%);
  pointer-events: none;
  z-index: 0;
}

/* ── Card ────────────────────────────────────────────────────────────────────── */
.card {
  position: relative;
  z-index: 1;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius-lg);
  padding: 2.75rem 2.5rem;
  width: 100%;
  max-width: 420px;
  box-shadow:
    0 4px 6px oklch(0 0 0 / 20%),
    0 24px 60px oklch(0 0 0 / 40%),
    0 0 0 1px var(--border);
  animation: riseIn .5s var(--ease-out) both;
}

@keyframes riseIn {
  from { opacity: 0; transform: translateY(20px) scale(.98) }
  to   { opacity: 1; transform: translateY(0) scale(1) }
}

/* ── Logo ────────────────────────────────────────────────────────────────────── */
.logo {
  text-align: center;
  margin-bottom: 2.25rem;
}

.logo-mark {
  width: 60px; height: 60px;
  background: linear-gradient(135deg, var(--primary) 0%, oklch(0.63 0.18 192) 100%);
  border-radius: 16px;
  display: inline-flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
  box-shadow: 0 0 0 1px oklch(0.72 0.15 192 / 40%), 0 8px 24px var(--primary-glow);
  transition: transform .3s var(--ease-out), box-shadow .3s;
}
.logo-mark:hover {
  transform: translateY(-2px) scale(1.04);
  box-shadow: 0 0 0 1px oklch(0.72 0.15 192 / 50%), 0 12px 32px var(--primary-glow);
}
.logo-mark svg { width: 28px; height: 28px }

.logo h1 {
  font-family: var(--font-heading);
  font-size: 1.375rem;
  font-weight: 700;
  letter-spacing: -.03em;
  color: var(--text);
}
.logo p {
  color: var(--text3);
  font-size: .8125rem;
  margin-top: .3rem;
}

/* ── Form ────────────────────────────────────────────────────────────────────── */
.field { margin-bottom: 1.125rem }

label {
  display: block;
  font-size: .6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text3);
  margin-bottom: .45rem;
}

.input-wrap {
  position: relative;
}
.input-wrap svg {
  position: absolute;
  left: .875rem; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--text3);
  pointer-events: none;
  transition: color .2s;
}

input {
  width: 100%;
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 11px;
  color: var(--text);
  padding: .75rem .875rem .75rem 2.625rem;
  font-size: .9rem;
  font-family: var(--font-sans);
  transition: border-color .2s, box-shadow .2s;
  outline: none;
}
input::placeholder { color: var(--text3) }
input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-s);
}
input:focus + svg,
.input-wrap:has(input:focus) svg { color: var(--primary) }

/* ── Button ──────────────────────────────────────────────────────────────────── */
.btn {
  width: 100%;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: 11px;
  padding: .85rem;
  font-size: .9375rem;
  font-weight: 700;
  font-family: var(--font-heading);
  letter-spacing: -.01em;
  cursor: pointer;
  transition: background .2s, transform .12s, box-shadow .2s;
  margin-top: .5rem;
  display: flex; align-items: center; justify-content: center; gap: .5rem;
  box-shadow: 0 1px 3px oklch(0 0 0 / 30%), 0 0 0 1px oklch(0.72 0.15 192 / 50%);
}
.btn:hover {
  background: var(--primary-d);
  box-shadow: 0 4px 16px var(--primary-glow);
}
.btn:active { transform: scale(.975) }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none }

/* ── Error ───────────────────────────────────────────────────────────────────── */
.error {
  background: oklch(0.65 0.24 27 / 10%);
  border: 1px solid oklch(0.65 0.24 27 / 30%);
  border-radius: 10px;
  color: oklch(0.8 0.14 27);
  padding: .75rem 1rem;
  font-size: .8375rem;
  margin-bottom: 1.125rem;
  display: none;
  align-items: center; gap: .5rem;
}
.error svg { width: 14px; height: 14px; flex-shrink: 0 }

/* ── Spinner ─────────────────────────────────────────────────────────────────── */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,.3);
  border-top-color: #fff;
  border-radius: 50%;
  animation: spin .6s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg) } }

/* ── Footer link ─────────────────────────────────────────────────────────────── */
.card-foot {
  margin-top: 1.5rem;
  text-align: center;
  font-size: .78rem;
  color: var(--text3);
}
.card-foot a {
  color: var(--primary);
  text-decoration: none;
  font-weight: 600;
  transition: opacity .15s;
}
.card-foot a:hover { opacity: .8 }
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
        <line x1="4" y1="22" x2="4" y2="15"></line>
      </svg>
    </div>
    <h1>ApexPress CRM</h1>
    <p>Painel de Controle e Infraestrutura Editorial</p>
  </div>

  <div class="error" id="err">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><path d="M8 5v3.5M8 11h.01"/></svg>
    <span id="errMsg"></span>
  </div>

  <div class="field">
    <label for="email">E-mail</label>
    <div class="input-wrap">
      <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12v9H2zM2 4l6 5 6-5"/></svg>
    </div>
  </div>

  <div class="field">
    <label for="password">Senha</label>
    <div class="input-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="10" height="8" rx="2"/><path d="M5 7V5a3 3 0 016 0v2"/></svg>
    </div>
  </div>

  <button class="btn" id="btn" onclick="login()">Entrar</button>

  <div class="card-foot">
    <a href="/">← Ver página inicial</a>
  </div>
</div>

<script>
  document.getElementById('email').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('password').focus() });
  document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login() });

  async function login() {
    const btn = document.getElementById('btn');
    const errEl = document.getElementById('err');
    const errMsg = document.getElementById('errMsg');
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    errEl.style.display = 'none';
    if(!email || !password){ showErr('Preencha e-mail e senha'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Entrando...';
    try {
      const r = await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
      const d = await r.json();
      if(r.ok){ window.location.href='/dashboard.html'; }
      else { showErr(d.error || 'Credenciais inválidas'); }
    } catch(e) { showErr('Erro de conexão. Tente novamente.'); }
    finally { btn.disabled=false; btn.innerHTML='Entrar'; }
  }

  function showErr(msg) {
    const errEl = document.getElementById('err');
    document.getElementById('errMsg').textContent = msg;
    errEl.style.display = 'flex';
  }
</script>
</body>
</html>
